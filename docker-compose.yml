services:
  mongo:
    image: mongo:6.0.27
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
        try { rs.status().ok }
        catch(e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
          rs.status().ok
        }"
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
